name: Build & Release SMS Relay APK

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test & Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v -keystore app/keystore.jks -alias hidorm-relay -keyalg RSA -keysize 2048 -validity 10000 -storepass hidorm1234 -keypass hidorm1234 -dname "CN=HiDorm, OU=Relay, O=HiDorm, L=Seoul, ST=Seoul, C=KR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Run Unit & Simulation Tests
        run: |
          gradle testDebugUnitTest --stacktrace

      - name: Build Debug & Release APK
        run: |
          gradle assembleRelease assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hidorm-sms-relay-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hidorm-sms-relay-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore

      - name: Update GitHub Release v1.0.0 Assets
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          gh release upload v1.0.0 app/build/outputs/apk/release/*.apk app/build/outputs/apk/debug/*.apk --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
